filter {
  if "endpoint" in [tags] or [agent][type] == "filebeat" or [agent][type] == "winlogbeat" {
    # Enrich and tag Windows Endpoint / Sysmon logs
    mutate {
      add_field => {
        "[event][category]" => "process"
        "[observer][vendor]" => "Microsoft"
        "[@metadata][target_index]" => "logs-endpoint.sysmon-default"
      }
    }
  }
}
