output {
  if [@metadata][target_index] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "%{[@metadata][target_index]}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD}"
      index => "logs-generic-default"
    }
  }
}
