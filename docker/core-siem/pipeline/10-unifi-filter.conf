filter {
  if "unifi" in [tags] {
    # Match standard Syslog header
    grok {
      match => {
        "message" => [
          # UniFi Firewall Rule Format: [RULE_NAME-RET-D] or [WAN_LOCAL-drop] with optional DESCR="..."
          "(?:<%{POSINT:[syslog][priority]}>)?%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[observer][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: \[%{DATA:[rule][name]}\](?:%{SPACE}DESCR=\"%{DATA:[rule][description]}\")?%{SPACE}%{GREEDYDATA:[unifi][firewall][raw]}",
          # UniFi IPS/IDS Threat Alert Format
          "(?:<%{POSINT:[syslog][priority]}>)?%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[observer][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: \[IPS:%{DATA:[threat][technique][name]}\] \[%{DATA:[threat][indicator][id]}\] %{GREEDYDATA:[threat][triage][description]}",
          # Standard RFC3164 Syslog Fallback
          "(?:<%{POSINT:[syslog][priority]}>)?%{SYSLOGTIMESTAMP:[syslog][timestamp]} %{HOSTNAME:[observer][name]} %{DATA:[process][name]}(?:\[%{POSINT:[process][pid]}\])?: %{GREEDYDATA:[event][original]}"
        ]
      }
      overwrite => ["message"]
    }

    # Parse Firewall Key-Values (SRC, DST, SPT, DPT, PROTO, IN, OUT, MAC)
    if [unifi][firewall][raw] {
      kv {
        source => "[unifi][firewall][raw]"
        field_split => " "
        value_split => "="
        target => "unifi_kv"
      }

      mutate {
        rename => {
          "[unifi_kv][SRC]"   => "[source][ip]"
          "[unifi_kv][DST]"   => "[destination][ip]"
          "[unifi_kv][SPT]"   => "[source][port]"
          "[unifi_kv][DPT]"   => "[destination][port]"
          "[unifi_kv][PROTO]" => "[network][transport]"
          "[unifi_kv][IN]"    => "[observer][ingress][interface][name]"
          "[unifi_kv][OUT]"   => "[observer][egress][interface][name]"
          "[unifi_kv][MAC]"   => "[source][mac]"
        }
        add_field => {
          "[event][category]" => "network"
          "[event][type]"     => "denied"
          "[event][action]"   => "firewall-drop"
          "[observer][vendor]" => "Ubiquiti"
          "[observer][type]"   => "router"
          "[observer][product]"=> "UniFi Dream Router"
        }
        convert => {
          "[source][port]"      => "integer"
          "[destination][port]" => "integer"
        }
        remove_field => ["[unifi_kv]"]
      }

      # Enrich external public IPs with GeoIP geolocation and ASN intelligence
      geoip {
        source => "[source][ip]"
        target => "[source][geo]"
      }

      geoip {
        source => "[source][ip]"
        target => "[source][as]"
        default_database_type => "ASN"
      }
    }

    # Assign ECS dataset
    mutate {
      add_field => {
        "[@metadata][target_index]" => "logs-network.unifi-default"
      }
    }
  }
}
