services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    container_name: jarvis-ollama-gpu
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - jarvis-compute-net

volumes:
  ollama_models:
    driver: local
    # To mount on your 11.5 TiB storage dataset:
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /mnt/pve-storage/jarvis/ollama_models

networks:
  jarvis-compute-net:
    name: jarvis-compute-net
    driver: bridge
